name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version and slug
        id: plugin
        run: |
          # The tag drives the version
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

          # The slug comes out of the built plugin header, so this workflow
          # never needs editing per repository
          SLUG="$( grep -rh -m1 'Text Domain:' distribute/*.php | sed 's/.*Text Domain:[[:space:]]*//' | tr -d '\r' | xargs )"
          if [ -z "${SLUG}" ]; then
            echo "! could not read the Text Domain from the built plugin header"
            exit 1
          fi
          echo "SLUG=${SLUG}" >> $GITHUB_OUTPUT

      - name: Build release zip
        run: |
          # Create a clean staging directory using the plugin slug
          mkdir -p dist/${{ steps.plugin.outputs.SLUG }}

          # Copy only the files that belong in the release
          cp -r distribute/. dist/${{ steps.plugin.outputs.SLUG }}/

          # Zip it up with the plugin folder as root
          cd dist
          zip -r ../${{ steps.plugin.outputs.SLUG }}-${{ steps.plugin.outputs.VERSION }}.zip ${{ steps.plugin.outputs.SLUG }}/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.plugin.outputs.VERSION }}
          generate_release_notes: true
          files: ${{ steps.plugin.outputs.SLUG }}-${{ steps.plugin.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
